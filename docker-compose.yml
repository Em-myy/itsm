
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itsm-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      PORT: "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_GO_API_URL: ${NEXT_PUBLIC_GO_API_URL}
    container_name: itsm-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      GO_API_INTERNAL_URL: ${GO_API_INTERNAL_URL}
      NODE_ENV: production
    restart: unless-stopped
